name: Build ArgonCut Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Generate Android Platform Files & Permissions
        run: |
          mkdir -p backup_code
          cp pubspec.yaml backup_code/
          cp -r lib backup_code/
          flutter create --org com.argon.capcutpro --project-name pro_video_editor .
          cp backup_code/pubspec.yaml .
          cp -r backup_code/lib/* lib/
          rm -rf backup_code

          # Set minSdkVersion to 24 (Required for Full GPL FFmpeg Engine)
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle

          # Inject Camera, Mic, Storage & Media Permissions
          sed -i '/<application/i <uses-permission android:name="android.permission.CAMERA"/>\n<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n<uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies & Build APK
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: ArgonCut-Pro-CapCut-Edition-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
